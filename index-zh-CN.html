<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoShorts.Win</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card-bg: #1a1a1a;
      --text: #e0e0e0;
      --muted: #999999;
      --primary: #4ade80;
      --border: #2a2a2a;
      --shadow: 0 10px 26px rgba(0, 0, 0, 0.35);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .lang-switcher {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 20px 0;
      display: flex;
      justify-content: flex-end;
    }
    .lang-switcher select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      padding: 5px 8px;
      cursor: pointer;
      outline: none;
    }
    .lang-switcher select:hover {
      border-color: var(--primary);
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .page-title {
      font-size: 32px;
      margin-bottom: 10px;
      text-align: center;
    }

    .page-desc {
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 15px;
      text-align: center;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: minmax(0, 400px);
      justify-content: center;
      gap: 20px;
    }

    .tool-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .tool-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #141414;
    }

    .tool-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .tool-title {
      font-size: 20px;
      font-weight: 700;
    }

    .tool-desc {
      font-size: 14px;
      color: var(--muted);
      flex: 1;
    }

    .tool-link {
      display: inline-block;
      align-self: flex-start;
      background: var(--primary);
      color: #0f0f0f;
      text-decoration: none;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
    }

    .tool-link:hover {
      background: #22c55e;
    }

    @media (max-width: 960px) {
      .tool-grid {
        grid-template-columns: minmax(0, 360px);
      }
    }

    @media (max-width: 640px) {
      .lang-switcher {
        padding: 14px 18px 0;
      }
      .container {
        padding-top: 16px;
      }

      .page-title {
        font-size: 26px;
      }

      .tool-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
</head>
<body>
  <script src="lang-query.js"></script>
  <div class="lang-switcher">
    <select id="index-lang" onchange="location.href=this.value" aria-label="界面语言">
      <option value="index.html">English</option>
      <option value="index-zh-CN.html" selected>简体中文</option>
      <option value="index-zh-TW.html">繁體中文</option>
      <option value="index-de-DE.html">Deutsch</option>
      <option value="index-es-ES.html">Español</option>
      <option value="index-fr-FR.html">Français</option>
      <option value="index-id-ID.html">Bahasa Indonesia</option>
      <option value="index-ja-JP.html">日本語</option>
      <option value="index-ko-KR.html">한국어</option>
      <option value="index-pt-BR.html">Português</option>
      <option value="index-ru-RU.html">Русский</option>
      <option value="index-th-TH.html">ภาษาไทย</option>
      <option value="index-vi-VN.html">Tiếng Việt</option>
    </select>
  </div>
  <main class="container">
    <h1 class="page-title">EchoShorts.Win</h1>
    <p class="page-desc">
      让精彩在短视频中回响，赢得永恒。
    </p>

    <section class="tool-grid" aria-label="工具入口列表">
      <article class="tool-card">
        <img class="tool-image" src="echoshortsplayer.png" alt="EchoShortsPlayer" />
        <div class="tool-body">
          <h2 class="tool-title">EchoShortsPlayer</h2>
          <p class="tool-desc">短视频播放与管理入口。</p>
          <a class="tool-link" href="home-zh.html?lang=zh-CN">打开工具</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
