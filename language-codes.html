<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoShortsPlayer - Supported Language Codes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f; color: #e0e0e0; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    main { flex: 1; max-width: 900px; margin: 0 auto; padding: 40px; width: 100%; }
    a { color: #4ade80; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    h1 span { color: #4ade80; }
    .back { font-size: 13px; color: #888; margin-bottom: 24px; display: inline-block; }
    .intro { font-size: 14px; color: #999; line-height: 1.7; margin-bottom: 24px; max-width: 640px; }
    .intro code { font-family: 'SF Mono', Consolas, monospace; font-size: 13px; color: #4ade80; background: #1a2a1a; padding: 1px 5px; border-radius: 3px; }
    .search-box { margin-bottom: 20px; }
    .search-box input {
      background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
      color: #e0e0e0; font-size: 14px; padding: 10px 16px; width: 100%; max-width: 400px;
      outline: none;
    }
    .search-box input:focus { border-color: #4ade80; }
    .search-box input::placeholder { color: #555; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
    thead th {
      text-align: left; font-size: 11px; font-weight: 600; color: #4ade80;
      text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 12px;
      border-bottom: 1px solid #2a2a2a; position: sticky; top: 0; background: #0f0f0f;
    }
    tbody td { font-size: 13px; color: #ccc; padding: 8px 12px; border-bottom: 1px solid #1a1a1a; }
    tbody tr:hover { background: #1a1a1a; }
    .code-cell { font-family: 'SF Mono', Consolas, monospace; color: #4ade80; font-weight: 600; }
    .hidden { display: none; }
    footer { text-align: center; padding: 20px 40px; border-top: 1px solid #1a1a1a; }
    footer span { font-size: 12px; color: #444; }
    @media (max-width: 600px) {
      main { padding: 20px 16px; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="home.html">&larr; Back to Home</a>
    <h1>Supported <span>Language Codes</span></h1>
    <p class="intro">
      Use these codes with the <code>--target</code> and <code>--source</code> CLI parameters.<br>
      Example: <code>resourcesbackendbackend.exe --cli translate video.mp4 --target ja</code>
    </p>

    <div class="search-box">
      <input type="text" id="search" placeholder="Search language or code..." autocomplete="off">
    </div>

    <table>
      <thead>
        <tr><th>Code</th><th>Language</th><th>Native Name</th></tr>
      </thead>
      <tbody id="lang-table">
      </tbody>
    </table>
  </main>

  <footer>
    <span>&copy; 2025 EchoShortsPlayer. All rights reserved.</span>
  </footer>

      ['yi', 'Yiddish', '\u05D9\u05D9\u05B4\u05D3\u05D9\u05E9'],
      ['yo', 'Yoruba', 'Yor\u00F9b\u00E1'],
      ['zh', 'Chinese', '\u4E2D\u6587'],
      ['yue', 'Cantonese', '\u7CB5\u8A9E'],
    ];

    const tbody = document.getElementById('lang-table');
    const searchInput = document.getElementById('search');

    function render(filter) {
      const f = (filter || '').toLowerCase();
      tbody.innerHTML = '';
      for (const [code, name, native] of langs) {
        if (f && !code.includes(f) && !name.toLowerCase().includes(f) && !native.toLowerCase().includes(f)) continue;
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="code-cell">${code}</td><td>${name}</td><td>${native}</td>`;
        tbody.appendChild(tr);
      }
    }

    searchInput.addEventListener('input', () => render(searchInput.value));
    render();
  </script>
</body>
</html>
