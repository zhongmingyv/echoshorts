  .checkbox-row .cb-note { font-size: 12px; color: var(--muted); display: block; }

  'netflix.com',
  'disneyplus.com',
  'disney.com',
  'primevideo.com',
  'amazon.*',

  'iq.com',
  'qq.com',
  'wetv.vip',
  'youku.com'
];

async function loadBlacklist() {
  try {
    const res = await fetch(`${API_BASE}/download-blacklist`);
    if (!res.ok) return;
    const data = await res.json();

let lang = 'en';

function t(key) {
  return (i18n[lang] && i18n[lang][key])
    || (RESUBMIT_I18N[lang] && RESUBMIT_I18N[lang][key])
    || i18n.en[key]
    || RESUBMIT_I18N.en[key]
    || key;
}

function detectLang() {
  const params = new URLSearchParams(window.location.search);
  let urlLang = params.get('lang');
  if (urlLang === 'cht') urlLang = 'zh-TW';
  if (urlLang && i18n[urlLang]) return urlLang;

  let browserLang = navigator.language || navigator.userLanguage || 'en';
  if (/^zh\b/i.test(browserLang)) {
    return /tw|hk|mo|hant/i.test(browserLang) ? 'zh-TW' : 'zh';
  }
  if (/^(no|nn)\b/i.test(browserLang)) return 'nb';
  if (i18n[browserLang]) return browserLang;
  const base = browserLang.split('-')[0].toLowerCase();
  if (i18n[base]) return base;
  return 'en';
}

function buildLangSwitcher() {
  const sel = document.getElementById('langSelect');
  Object.keys(i18n).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = LANG_NAMES[code] || code;
    sel.appendChild(opt);
  });
}

let subtitleLangTouched = false;

function buildSubtitleLangSelect() {
  const sel = document.getElementById('subtitleLangSelect');
  Object.keys(i18n).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = LANG_NAMES[code] || code;
    sel.appendChild(opt);
  });
}

function changeLang() {
  lang = document.getElementById('langSelect').value;
  applyLang();
}

function applyLang() {
  document.getElementById('langSelect').value = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL_LANGS.includes(lang) ? 'rtl' : 'ltr';
  document.title = t('title') + ' - EchoShorts';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.getAttribute('data-i18n-ph'));
  });
  document.getElementById('subtitleLangLabel').textContent =
    t('subtitleNote').replace('{lang}', '').trim();
  if (!subtitleLangTouched) document.getElementById('subtitleLangSelect').value = lang;
  if (resubmitMode) {
    document.title = t('resubmitTitle') + ' - EchoShorts';
    document.querySelector('[data-i18n="title"]').textContent = t('resubmitTitle');
    document.querySelector('[data-i18n="tagline"]').textContent = t('resubmitTagline');
    document.getElementById('payBtn').textContent = t('confirmBtn');
    if (resultKey) document.getElementById('resultText').textContent = t(resultKey);
  }
  updateState();
}

// ── Validation & state ──

function isBlacklisted(videoUrl) {
  let host;
  try {
    host = new URL(videoUrl).hostname.toLowerCase();
  } catch {
    return false;
  }
  return blacklistDomains.some(d => {
    if (d.endsWith('.*')) {
      const name = d.slice(0, -2).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp('(^|\\.)' + name + '\\.').test(host);
    }
    return host === d || host.endsWith('.' + d);
  });
}

function currentPrice() {
  return document.getElementById('subtitleCheck').checked ? PRICE_SUBTITLE : PRICE_BASIC;
}

function updateState() {
  document.getElementById('totalPrice').textContent = '$' + currentPrice();

  const url = document.getElementById('urlInput').value.trim();
  const blocked = url && isBlacklisted(url);

  const domainError = document.getElementById('domainError');
  domainError.textContent = t('blacklistError');
  domainError.style.display = blocked ? 'block' : 'none';
  document.getElementById('urlInput').classList.toggle('input-error', !!blocked);

  document.getElementById('payBtn').disabled = !!blocked;

  document.getElementById('subtitleLangRow').style.display =
    document.getElementById('subtitleCheck').checked ? 'flex' : 'none';
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function validateForm() {
  const emailInput = document.getElementById('emailInput');
  const email = emailInput.value.trim();
  if (!email || !emailInput.validity.valid) {
    showError(t('emailRequired'));
    emailInput.focus();
    return null;
  }

  const url = document.getElementById('urlInput').value.trim();
  let parsed;
  try { parsed = new URL(url); } catch { parsed = null; }
  if (!parsed || (parsed.protocol !== 'http:' && parsed.protocol !== 'https:')) {
    showError(t('urlRequired'));
    document.getElementById('urlInput').focus();
    return null;
  }
  if (isBlacklisted(url)) {
    showError(t('blacklistError'));
    return null;
  }

  const needSubtitle = document.getElementById('subtitleCheck').checked;
  return {
    email,
    videoUrl: url,
    needSubtitle,
    subtitleLang: needSubtitle ? document.getElementById('subtitleLangSelect').value : null,
    lang
  };
}

// ── Paddle (via license worker → vnpaddle) ──

async function handlePay() {
  if (resubmitMode) return handleResubmitConfirm();
  const form = validateForm();
  if (!form) return;

  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + t('processing');

  try {
    const resp = await fetch(`${API_BASE}/download-purchase`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(form)
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || t('purchaseError'));

    if (data.checkoutUrl) {
      window.location.href = data.checkoutUrl;
    } else {
      showError(t('purchaseError'));
    }
  } catch (err) {
    console.error('Purchase error:', err);
    showError(err.message || t('purchaseError'));
  } finally {
    btn.disabled = false;
    btn.textContent = t('payBtn');
    updateState();
  }
}

// ── Resubmit mode (customer returns via the email link after a failed order) ──

let resubmitMode = false;
let resubmitOrderId = null;
let resubmitToken = null;
let resultKey = null;

function showResult(key, ok) {
  resultKey = key;
  document.getElementById('formArea').style.display = 'none';
  const rs = document.getElementById('resultState');
  rs.style.display = 'block';
  const icon = document.getElementById('resultIcon');
  icon.textContent = ok ? '✓' : '!';
  icon.style.color = ok ? 'var(--primary)' : 'var(--error)';
  document.getElementById('resultText').textContent = t(key);
}

async function initResubmit() {
  try {
    const res = await fetch(`${API_BASE}/download-orders/${encodeURIComponent(resubmitOrderId)}/resubmit-info?token=${encodeURIComponent(resubmitToken)}`);
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.success) {
      showResult('linkInvalid', false);
      applyLang();
      return;
    }
    if (data.lang && i18n[data.lang]) lang = data.lang;

    const emailInput = document.getElementById('emailInput');
    emailInput.value = data.email || '';
    emailInput.disabled = true;
    document.getElementById('urlInput').value = data.videoUrl || '';

    const cb = document.getElementById('subtitleCheck');
    cb.checked = !!data.needSubtitle;
    cb.disabled = true;
    const sel = document.getElementById('subtitleLangSelect');
    if (data.subtitleLang) { sel.value = data.subtitleLang; subtitleLangTouched = true; }
    sel.disabled = true;

    document.getElementById('priceSection').style.display = 'none';
    applyLang();
    document.getElementById('urlInput').focus();
  } catch {
    showResult('linkInvalid', false);
    applyLang();
  }
}

async function handleResubmitConfirm() {
  const url = document.getElementById('urlInput').value.trim();
  let parsed;
  try { parsed = new URL(url); } catch { parsed = null; }
  if (!parsed || (parsed.protocol !== 'http:' && parsed.protocol !== 'https:')) {
    showError(t('urlRequired'));
    document.getElementById('urlInput').focus();
    return;
  }
  if (isBlacklisted(url)) {
    showError(t('blacklistError'));
    return;
  }

  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + t('processing');

  try {
    const resp = await fetch(`${API_BASE}/download-orders/${encodeURIComponent(resubmitOrderId)}/resubmit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: resubmitToken, videoUrl: url })
    });
    const data = await resp.json().catch(() => ({}));
    if (resp.ok && data.success) {
      showResult('resubmitDone', true);
      return;
    }
    if (data.error === 'invalid_link' || data.error === 'not_resubmittable') {
      showResult('linkInvalid', false);
      return;
    }
    if (data.error === 'domain_blacklisted') showError(t('blacklistError'));
    else if (data.error === 'invalid_video_url' || data.error === 'missing_video_url') showError(t('urlRequired'));
    else showError(t('purchaseError'));
  } catch (err) {
    console.error('Resubmit error:', err);
    showError(t('purchaseError'));
  } finally {
    btn.disabled = false;
    btn.textContent = resubmitMode ? t('confirmBtn') : t('payBtn');
    updateState();
  }
}

// ── Init ──
buildLangSwitcher();
buildSubtitleLangSelect();
lang = detectLang();

const initParams = new URLSearchParams(window.location.search);
if (initParams.get('resubmit') && initParams.get('token')) {
  resubmitMode = true;
  resubmitOrderId = initParams.get('resubmit');
  resubmitToken = initParams.get('token');
  applyLang();
  loadBlacklist();
  initResubmit();
} else {
  applyLang();
  loadBlacklist();
}
</script>
