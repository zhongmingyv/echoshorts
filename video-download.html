<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Download - EchoShorts</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card-bg: #1a1a1a;
    --text: #e0e0e0;
    --muted: #999999;
    --primary: #4ade80;
    --primary-hover: #22c55e;
    --border: #2a2a2a;
    --error: #f87171;
    --error-bg: #2d1b1b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
  }

  .container { width: 100%; max-width: 480px; }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    padding: 36px 32px;
  }

  .lang-switcher-wrap { text-align: right; margin-bottom: 8px; }
  html[dir="rtl"] .lang-switcher-wrap { text-align: left; }

  .lang-switcher {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    padding: 5px 8px;
    cursor: pointer;
    outline: none;
  }
  .lang-switcher:focus { border-color: var(--primary); }

  .app-header { text-align: center; margin-bottom: 24px; }
  .app-header h1 { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .app-header .tagline { font-size: 13px; color: var(--muted); }

  label { display: block; font-size: 14px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }

  input[type="email"], input[type="url"], input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: var(--primary); }
  input::placeholder { color: #555; }
  input.input-error { border-color: var(--error); }

  .field-group { margin-bottom: 18px; }

  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }
  .checkbox-row input[type="checkbox"] {
    width: 18px; height: 18px;
    margin-top: 3px;
    accent-color: var(--primary);
    cursor: pointer;
    flex-shrink: 0;
  }
  .checkbox-row .cb-text { font-size: 14px; color: var(--text); }
  .checkbox-row .cb-note { font-size: 12px; color: var(--muted); display: block; }

  .subtitle-lang-row {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding-inline-start: 28px;
  }
  .subtitle-lang-row .sub-lang-label {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    flex-shrink: 0;
    font-weight: 400;
  }
  .subtitle-lang-row select {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .subtitle-lang-row select:focus { border-color: var(--primary); }

  .price-section {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .price-row {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    font-weight: 600;
  }
  .price-row .amount { color: var(--primary); }

  .domain-error {
    display: none;
    background: var(--error-bg);
    border: 1px solid var(--error);
    color: var(--error);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 18px;
  }

  .error-msg {
    display: none;
    background: var(--error-bg);
    border: 1px solid var(--error);
    color: var(--error);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 18px;

    font-size: 16px;
    font-weight: 600;
    cursor: pointer;

  .btn-pay:disabled { opacity: 0.4; cursor: not-allowed; }

    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
    margin: 16px 0;

  .pay-divider::before, .pay-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  #paypalWrap.disabled { opacity: 0.4; pointer-events: none; }
  .paypal-unavailable {

    font-size: 12px;

    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 12px;

    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 18px;

    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #0f0f0f;

    vertical-align: -2px;
    margin-inline-end: 8px;

  .footer { text-align: center; margin-top: 20px; font-size: 12px; }
  .footer a { color: var(--muted); text-decoration: none; }
  .footer a:hover { color: var(--primary); }
</style>
</head>

<div class="container">
  <div class="lang-switcher-wrap">
    <select class="lang-switcher" id="langSelect" onchange="changeLang()"></select>
  </div>

  <div class="card">
    <div class="app-header">
      <h1 data-i18n="title">Video Download</h1>
      <p class="tagline" data-i18n="tagline">Paste a video link, pay, and we will email you the download link.</p>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <div class="field-group">
      <label data-i18n="emailLabel">Email</label>
      <input type="email" id="emailInput" data-i18n-ph="emailPlaceholder" placeholder="your@email.com">
    </div>

    <div class="field-group">
      <label data-i18n="urlLabel">Video URL</label>
      <input type="url" id="urlInput" data-i18n-ph="urlPlaceholder" placeholder="https://..." oninput="updateState()">
    </div>

    <div id="domainError" class="domain-error"></div>

    <div class="field-group">
      <label class="checkbox-row">
        <input type="checkbox" id="subtitleCheck" onchange="updateState()">
        <span>
          <span class="cb-text" data-i18n="subtitleCheck">I need subtitles</span>
        </span>
      </label>
      <div class="subtitle-lang-row" id="subtitleLangRow">
        <span class="sub-lang-label" id="subtitleLangLabel">Subtitle language:</span>
        <select id="subtitleLangSelect" onchange="subtitleLangTouched = true"></select>
      </div>
    </div>

    <div class="price-section">
      <div class="price-row">
        <span data-i18n="totalLabel">Total</span>
        <span class="amount" id="totalPrice">$1.00</span>
      </div>
    </div>

    <button class="btn-pay" id="payBtn" onclick="handlePay()" data-i18n="payBtn">Pay Now</button>

    <div class="pay-divider"><span data-i18n="orPay">or</span></div>

    <div id="paypalWrap">
      <div id="paypal-button-container"></div>
      <div class="paypal-unavailable" id="paypalUnavailable"></div>
    </div>

    <p class="delivery-note" data-i18n="deliveryNote">The download link will be sent to your email within 48 hours after payment.</p>
  </div>

  <div class="footer">
    <a href="https://echoshorts.win">echoshorts.win</a>
  </div>
</div>

// Fallback list used until the live blacklist loads from the worker.
// Entries ending in ".*" match the name across all TLDs (e.g. "amazon.*").
let blacklistDomains = [
  'netflix.com',
  'disneyplus.com',
  'disney.com',
  'primevideo.com',
  'amazon.*',
  'apple.com',
  'hbomax.com',
  'max.com',
  'hbo.com',
  'iqiyi.com',
  'iq.com',
  'qq.com',
  'wetv.vip',
  'youku.com'
];

async function loadBlacklist() {
  try {
    const res = await fetch(`${API_BASE}/download-blacklist`);
    if (!res.ok) return;
    const data = await res.json();
    if (Array.isArray(data.domains)) {
      blacklistDomains = data.domains;
      updateState();
    }
  } catch {}
}

let lang = 'en';

function t(key) {
  return (i18n[lang] && i18n[lang][key]) || i18n.en[key] || key;
}

function detectLang() {
  const params = new URLSearchParams(window.location.search);
  let urlLang = params.get('lang');
  if (urlLang === 'cht') urlLang = 'zh-TW';
  if (urlLang && i18n[urlLang]) return urlLang;

  let browserLang = navigator.language || navigator.userLanguage || 'en';
  if (/^zh\b/i.test(browserLang)) {
    return /tw|hk|mo|hant/i.test(browserLang) ? 'zh-TW' : 'zh';
  }
  if (/^(no|nn)\b/i.test(browserLang)) return 'nb';
  if (i18n[browserLang]) return browserLang;
  const base = browserLang.split('-')[0].toLowerCase();
  if (i18n[base]) return base;
  return 'en';
}

function buildLangSwitcher() {
  const sel = document.getElementById('langSelect');
  Object.keys(i18n).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = LANG_NAMES[code] || code;
    sel.appendChild(opt);
  });
}

let subtitleLangTouched = false;

function buildSubtitleLangSelect() {
  const sel = document.getElementById('subtitleLangSelect');
  Object.keys(i18n).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = LANG_NAMES[code] || code;
    sel.appendChild(opt);
  });
}

function changeLang() {
  lang = document.getElementById('langSelect').value;
  applyLang();
}

function applyLang() {
  document.getElementById('langSelect').value = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL_LANGS.includes(lang) ? 'rtl' : 'ltr';
  document.title = t('title') + ' - EchoShorts';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.getAttribute('data-i18n-ph'));
  });
  document.getElementById('subtitleLangLabel').textContent =
    t('subtitleNote').replace('{lang}', '').trim();
  if (!subtitleLangTouched) document.getElementById('subtitleLangSelect').value = lang;
  updateState();
}

// ── Validation & state ──

function isBlacklisted(videoUrl) {
  let host;
  try {
    host = new URL(videoUrl).hostname.toLowerCase();
  } catch {
    return false;
  }
  return blacklistDomains.some(d => {
    if (d.endsWith('.*')) {
      const name = d.slice(0, -2).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp('(^|\\.)' + name + '\\.').test(host);
    }
    return host === d || host.endsWith('.' + d);
  });
}

function currentPrice() {
  return document.getElementById('subtitleCheck').checked ? PRICE_SUBTITLE : PRICE_BASIC;
}

function updateState() {
  document.getElementById('totalPrice').textContent = '$' + currentPrice();

  const url = document.getElementById('urlInput').value.trim();
  const blocked = url && isBlacklisted(url);

  const domainError = document.getElementById('domainError');
  domainError.textContent = t('blacklistError');
  domainError.style.display = blocked ? 'block' : 'none';
  document.getElementById('urlInput').classList.toggle('input-error', !!blocked);

  document.getElementById('payBtn').disabled = !!blocked;
  document.getElementById('paypalWrap').classList.toggle('disabled', !!blocked);

  document.getElementById('subtitleLangRow').style.display =
    document.getElementById('subtitleCheck').checked ? 'flex' : 'none';
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function validateForm() {
  const emailInput = document.getElementById('emailInput');
  const email = emailInput.value.trim();
  if (!email || !emailInput.validity.valid) {
    showError(t('emailRequired'));
    emailInput.focus();
    return null;
  }

  const url = document.getElementById('urlInput').value.trim();
  let parsed;
  try { parsed = new URL(url); } catch { parsed = null; }
  if (!parsed || (parsed.protocol !== 'http:' && parsed.protocol !== 'https:')) {
    showError(t('urlRequired'));
    document.getElementById('urlInput').focus();
    return null;
  }
  if (isBlacklisted(url)) {
    showError(t('blacklistError'));
    return null;
  }

  const needSubtitle = document.getElementById('subtitleCheck').checked;
  return {
    email,
    videoUrl: url,
    needSubtitle,
    subtitleLang: needSubtitle ? document.getElementById('subtitleLangSelect').value : null,
    lang
  };
}

// ── Paddle (via license worker → vnpaddle) ──

async function handlePay() {
  const form = validateForm();
  if (!form) return;

  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + t('processing');

  try {
    const resp = await fetch(`${API_BASE}/download-purchase`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(form)
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || t('purchaseError'));

    if (data.checkoutUrl) {
      window.location.href = data.checkoutUrl;
    } else {
      showError(t('purchaseError'));
    }
  } catch (err) {
    console.error('Purchase error:', err);
    showError(err.message || t('purchaseError'));
  } finally {
    btn.disabled = false;
    btn.textContent = t('payBtn');
    updateState();
  }
}

// ── PayPal Smart Buttons ──

function initPaypal() {
  if (!PAYPAL_CLIENT_ID || PAYPAL_CLIENT_ID === 'YOUR_PAYPAL_CLIENT_ID') {
    const el = document.getElementById('paypalUnavailable');
    el.textContent = t('paypalUnavailable');
    el.style.display = 'block';
    return;
  }

  const script = document.createElement('script');
  script.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(PAYPAL_CLIENT_ID) + '&currency=USD&intent=capture';
  script.onload = renderPaypalButtons;
  script.onerror = () => {
    const el = document.getElementById('paypalUnavailable');
    el.textContent = t('paypalUnavailable');
    el.style.display = 'block';
  };
  document.head.appendChild(script);
}

function renderPaypalButtons() {
  paypal.Buttons({
    style: { layout: 'horizontal', color: 'gold', shape: 'rect', label: 'paypal', tagline: false, height: 45 },

    onClick(data, actions) {
      return validateForm() ? actions.resolve() : actions.reject();
    },

    createOrder(data, actions) {
      const form = validateForm();
      const desc = ('Video download' + (form.needSubtitle ? ' + subtitles (' + form.subtitleLang + ')' : '') + ': ' + form.videoUrl).slice(0, 127);
      return actions.order.create({
        purchase_units: [{
          amount: { value: currentPrice(), currency_code: 'USD' },
          description: desc
        }]
      });
    },

    async onApprove(data, actions) {
      const capture = await actions.order.capture();
      const form = validateForm();
      try {
        await fetch(`${API_BASE}/download-paypal-record`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...form,
            paypalOrderId: data.orderID,
            captureId: capture?.purchase_units?.[0]?.payments?.captures?.[0]?.id || null
          })
        });
      } catch (err) {
        // Payment already captured by PayPal — recording failure must not block the user.
        console.error('Order record failed:', err);
      }
      window.location.href = 'video-download-success.html?lang=' + encodeURIComponent(lang);
    },

    onError(err) {
      console.error('PayPal error:', err);
      showError(t('purchaseError'));
    }
  }).render('#paypal-button-container');
}

// ── Init ──
buildLangSwitcher();
buildSubtitleLangSelect();
lang = detectLang();
applyLang();
loadBlacklist();
initPaypal();
</script>
