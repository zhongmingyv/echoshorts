<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
    }
    .checkout-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    /* Paddle inline checkout will render here */
    .paddle-checkout {
      min-height: 400px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }
    /* 结账框上方那行安全提示:卡号直接交给 Paddle,不经过本站 */
    .secure-note {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-bottom: 12px;
      font-size: 13px; color: #555; text-align: center; line-height: 1.5;
    }
    .secure-note a { color: #4f46e5; text-decoration: none; white-space: nowrap; }
    .secure-note a:hover { text-decoration: underline; }
    .bottom-bar {
      text-align: center;
      padding: 20px;
    }
    .bottom-bar a {
      display: inline-block;
      padding: 12px 32px;
      background: #4f46e5;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .bottom-bar a:hover { background: #4338ca; }
    .bottom-bar .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #888;
    }
    .success-msg {
      text-align: center;
      padding: 60px 20px;
    }
    .success-msg h2 {
      color: #16a34a;
      font-size: 22px;
      margin-bottom: 12px;
    }
    .success-msg p {
      color: #666;
      font-size: 15px;
      margin-bottom: 20px;
    }
    .error-msg {
      text-align: center;
      padding: 60px 20px;
      color: #dc2626;
    }
    .lang-switcher {
      position: fixed; top: 16px; right: 16px;
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 4px 8px; font-size: 14px; color: #333;
      cursor: pointer; outline: none;
    }
    .lang-switcher:hover { border-color: #4f46e5; }
  </style>
  <!-- Microsoft Clarity -->
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x0mzw2pbc2");
  </script>
</head>
<body>
  <select class="lang-switcher" id="lang-select" onchange="switchLang(this.value)">
    <option value="en">English</option>
    <option value="zh-CN">简体中文</option>
    <option value="zh-TW">繁體中文</option>
    <option value="vi">Tiếng Việt</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="th">ภาษาไทย</option>
    <option value="id">Bahasa Indonesia</option>
    <option value="ms">Bahasa Melayu</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="pt">Português</option>
    <option value="ru">Русский</option>
    <option value="ar">العربية</option>
  </select>

  <div class="checkout-container">
    <!-- Trust note: card details go to Paddle's iframe, not this site -->
    <div class="secure-note" id="secureNote">
      <span>🔒</span>
      <span><span id="secureNoteText"></span> <a href="https://www.paddle.com/legal/checkout-buyer-terms" target="_blank" rel="noopener">Paddle ↗</a></span>
    </div>

    <!-- Paddle inline checkout renders inside this div -->
    <div class="paddle-checkout" id="paddle-checkout"></div>

    <!-- Always visible: already paid button -->
    <div class="bottom-bar" id="bottomBar" style="display:none;">
      <a id="paidBtn" onclick="goSuccess()"></a>
      <div class="hint" id="paidHint"></div>
    </div>

    <!-- Success message (shown when checkout.completed fires) -->
    <div class="success-msg" id="successMsg" style="display:none;">
      <h2 id="successTitle"></h2>
      <p id="successText"></p>
      <a id="successBtn" style="display:inline-block;padding:12px 32px;background:#16a34a;color:#fff;font-size:15px;font-weight:600;border-radius:8px;text-decoration:none;cursor:pointer;" onclick="goSuccess()"></a>
    </div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg" style="display:none;"></div>
  </div>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var TXN_ID = params.get('txn_id') || '';
    var currentLang = params.get('lang') || 'en';
    var successUrl = params.get('success_url') ? decodeURIComponent(params.get('success_url')) : '';
    var CUSTOMER_EMAIL = params.get('email') || '';

    var PADDLE_CONFIG_URL = 'https://pay.echoshorts.win/api/paddle-config';

    var i18n = {
      'en':    { alreadyPaid: 'I have completed payment', paidHint: 'Click here if you have already paid (e.g. via QR code on your phone)', successTitle: 'Payment Successful!', successText: 'Your activation code will be sent to your email shortly.', successBtn: 'Continue', initFail: 'Failed to initialize checkout', secureNote: 'Payment is securely processed by Paddle and never passes through this site.' },
      'zh-CN': { alreadyPaid: '我已完成支付', paidHint: '如果您已通过扫码等方式完成支付，请点击此处', successTitle: '支付成功！', successText: '激活码将很快发送到您的邮箱。', successBtn: '继续', initFail: '初始化结账失败', secureNote: '付款由 Paddle 安全处理，不经过本站。' },
      'zh-TW': { alreadyPaid: '我已完成付款', paidHint: '如果您已透過掃碼等方式完成付款，請點擊此處', successTitle: '付款成功！', successText: '啟用碼將很快發送到您的信箱。', successBtn: '繼續', initFail: '初始化結帳失敗', secureNote: '付款由 Paddle 安全處理，不經過本站。' },
      'vi':    { alreadyPaid: 'Tôi đã thanh toán', paidHint: 'Nhấn vào đây nếu bạn đã thanh toán qua QR code', successTitle: 'Thanh toán thành công!', successText: 'Mã kích hoạt sẽ được gửi đến email của bạn.', successBtn: 'Tiếp tục', initFail: 'Khởi tạo thất bại', secureNote: 'Thanh toán được Paddle xử lý an toàn, không đi qua trang này.' },
      'ja':    { alreadyPaid: '支払い済みです', paidHint: 'QRコード等で支払い済みの場合はこちらをクリック', successTitle: '支払い完了！', successText: 'アクティベーションコードがメールで送信されます。', successBtn: '続行', initFail: '初期化に失敗しました', secureNote: 'お支払いは Paddle が安全に処理し、本サイトを経由しません。' },
      'ko':    { alreadyPaid: '결제 완료했습니다', paidHint: 'QR코드 등으로 이미 결제하셨다면 여기를 클릭하세요', successTitle: '결제 완료!', successText: '활성화 코드가 이메일로 발송됩니다.', successBtn: '계속', initFail: '초기화 실패', secureNote: '결제는 Paddle이 안전하게 처리하며 이 사이트를 거치지 않습니다.' },
      'th':    { alreadyPaid: 'ฉันชำระเงินแล้ว', paidHint: 'คลิกที่นี่หากคุณชำระเงินผ่าน QR code แล้ว', successTitle: 'ชำระเงินสำเร็จ!', successText: 'รหัสเปิดใช้งานจะถูกส่งไปยังอีเมลของคุณ', successBtn: 'ดำเนินการต่อ', initFail: 'เริ่มต้นล้มเหลว', secureNote: 'การชำระเงินดำเนินการอย่างปลอดภัยโดย Paddle และไม่ผ่านเว็บไซต์นี้' },
      'id':    { alreadyPaid: 'Saya sudah membayar', paidHint: 'Klik di sini jika Anda sudah membayar melalui QR code', successTitle: 'Pembayaran berhasil!', successText: 'Kode aktivasi akan dikirim ke email Anda.', successBtn: 'Lanjutkan', initFail: 'Gagal menginisialisasi', secureNote: 'Pembayaran diproses dengan aman oleh Paddle dan tidak melewati situs ini.' },
      'ms':    { alreadyPaid: 'Saya sudah membayar', paidHint: 'Klik di sini jika anda sudah membayar melalui QR code', successTitle: 'Pembayaran berjaya!', successText: 'Kod pengaktifan akan dihantar ke e-mel anda.', successBtn: 'Teruskan', initFail: 'Gagal memulakan', secureNote: 'Pembayaran diproses dengan selamat oleh Paddle dan tidak melalui laman ini.' },
      'es':    { alreadyPaid: 'Ya he pagado', paidHint: 'Haz clic aquí si ya pagaste por QR code', successTitle: '¡Pago exitoso!', successText: 'Tu código de activación será enviado a tu correo.', successBtn: 'Continuar', initFail: 'Error al inicializar', secureNote: 'El pago lo procesa Paddle de forma segura y nunca pasa por este sitio.' },
      'fr':    { alreadyPaid: "J'ai déjà payé", paidHint: 'Cliquez ici si vous avez déjà payé par QR code', successTitle: 'Paiement réussi !', successText: "Votre code d'activation sera envoyé par e-mail.", successBtn: 'Continuer', initFail: "Échec de l'initialisation", secureNote: 'Le paiement est traité en toute sécurité par Paddle et ne transite jamais par ce site.' },
      'de':    { alreadyPaid: 'Ich habe bereits bezahlt', paidHint: 'Klicken Sie hier, wenn Sie bereits per QR-Code bezahlt haben', successTitle: 'Zahlung erfolgreich!', successText: 'Ihr Aktivierungscode wird per E-Mail gesendet.', successBtn: 'Weiter', initFail: 'Initialisierung fehlgeschlagen', secureNote: 'Die Zahlung wird sicher von Paddle abgewickelt und läuft nie über diese Website.' },
      'pt':    { alreadyPaid: 'Já paguei', paidHint: 'Clique aqui se você já pagou via QR code', successTitle: 'Pagamento realizado!', successText: 'Seu código de ativação será enviado por e-mail.', successBtn: 'Continuar', initFail: 'Falha ao inicializar', secureNote: 'O pagamento é processado com segurança pela Paddle e nunca passa por este site.' },
      'ru':    { alreadyPaid: 'Я уже оплатил', paidHint: 'Нажмите здесь, если вы уже оплатили через QR-код', successTitle: 'Оплата прошла!', successText: 'Код активации будет отправлен на вашу почту.', successBtn: 'Продолжить', initFail: 'Ошибка инициализации', secureNote: 'Оплата безопасно обрабатывается Paddle и не проходит через этот сайт.' },
      'ar':    { alreadyPaid: 'لقد دفعت بالفعل', paidHint: 'انقر هنا إذا كنت قد دفعت بالفعل عبر رمز QR', successTitle: 'تم الدفع بنجاح!', successText: '.سيتم إرسال رمز التفعيل إلى بريدك الإلكتروني', successBtn: 'متابعة', initFail: 'فشل في التهيئة', secureNote: '.تتم معالجة الدفع بأمان بواسطة Paddle ولا يمر عبر هذا الموقع' }
    };

    var langAliases = { 'zh': 'zh-CN', 'zh-cn': 'zh-CN', 'zh-tw': 'zh-TW', 'cht': 'zh-TW' };

    function t(key) {
      var lang = langAliases[currentLang] || currentLang;
      return (i18n[lang] || i18n['en'])[key] || i18n['en'][key];
    }

    function switchLang(lang) {
      currentLang = lang;
      applyLang();
    }

    function applyLang() {
      document.getElementById('lang-select').value = currentLang;
      document.getElementById('paidBtn').textContent = t('alreadyPaid');
      document.getElementById('paidHint').textContent = t('paidHint');
      document.getElementById('secureNoteText').textContent = t('secureNote');
      document.documentElement.lang = currentLang;
    }

    function goSuccess() {
      if (successUrl) {
        window.location.href = successUrl;
      } else {
        window.location.href = 'https://echoshorts.win/purchase-success.html';
      }
    }

    function showSuccess() {
      document.getElementById('paddle-checkout').style.display = 'none';
      document.getElementById('secureNote').style.display = 'none';
      document.getElementById('bottomBar').style.display = 'none';
      var msg = document.getElementById('successMsg');
      document.getElementById('successTitle').textContent = t('successTitle');
      document.getElementById('successText').textContent = t('successText');
      document.getElementById('successBtn').textContent = t('successBtn');
      msg.style.display = 'block';
      // Auto redirect after 3 seconds
      setTimeout(goSuccess, 3000);
    }

    async function init() {
      applyLang();

      if (!TXN_ID) {
        document.getElementById('errorMsg').textContent = 'Missing transaction ID';
        document.getElementById('errorMsg').style.display = 'block';
        return;
      }

      try {
        var res = await fetch(PADDLE_CONFIG_URL);
        var json = await res.json();
        var config = json.data;

        if (config.environment === 'sandbox') {
          Paddle.Environment.set('sandbox');
        }

        Paddle.Initialize({
          token: config.client_token,
          checkout: {
            settings: {
              displayMode: 'inline',
              frameTarget: 'paddle-checkout',
              frameInitialHeight: 450,
              frameStyle: 'width: 100%; border: none; border-radius: 12px; min-height: 400px;',
              // 折扣走我们自己的折扣码(下单时就算进价格),不用 Paddle 自带的那一套;不开增值税发票
              showAddDiscounts: false,
              showAddTaxId: false,
              // 不收银行卡(没人敢在陌生网站上填卡号):只留扫码与钱包类。账号没开通的方式 Paddle 自己不显示
              allowedPaymentMethods: ['wechat_pay', 'alipay', 'paypal', 'apple_pay', 'google_pay']
            }
          },
          eventCallback: function(event) {
            console.log('[Paddle Event]', event.name, event);
            if (event.name === 'checkout.completed') {
              showSuccess();
            }
          }
        });

        var checkoutOpts = { transactionId: TXN_ID };
        var normalizedLang = langAliases[currentLang] || currentLang;
        var customer = {};
        if (CUSTOMER_EMAIL) customer.email = CUSTOMER_EMAIL;
        if (normalizedLang === 'zh-CN') customer.address = { countryCode: 'CN' };
        if (Object.keys(customer).length > 0) checkoutOpts.customer = customer;
        Paddle.Checkout.open(checkoutOpts);

        // Show "already paid" button after 5 seconds
        setTimeout(function() {
          document.getElementById('bottomBar').style.display = 'block';
        }, 5000);

      } catch (err) {
        document.getElementById('errorMsg').textContent = t('initFail') + ': ' + err.message;
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    init();
  </script>
</body>
</html>
