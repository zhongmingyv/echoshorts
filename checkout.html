<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { text-align: center; padding: 40px; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { color: #666; font-size: 16px; }
    .success { color: #16a34a; font-size: 18px; font-weight: 600; }
    .error { color: #dc2626; font-size: 16px; }
    .back-link { margin-top: 20px; }
    .back-link a { color: #4f46e5; text-decoration: none; cursor: pointer; }
    .lang-switcher {
      position: fixed; top: 16px; right: 16px;
      background: #fff; border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 4px 8px; font-size: 14px; color: #333;
      cursor: pointer; outline: none;
    }
    .lang-switcher:hover { border-color: #4f46e5; }
  </style>
</head>
<body>
  <select class="lang-switcher" id="lang-select" onchange="switchLang(this.value)">
    <option value="en">English</option>
    <option value="zh-CN">简体中文</option>
    <option value="zh-TW">繁體中文</option>
    <option value="vi">Tiếng Việt</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
    <option value="th">ภาษาไทย</option>
    <option value="id">Bahasa Indonesia</option>
    <option value="ms">Bahasa Melayu</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="pt">Português</option>
    <option value="ru">Русский</option>
    <option value="ar">العربية</option>
  </select>

  <div class="container">
    <div id="loading">
      <div class="spinner"></div>
      <p class="status" id="loading-text"></p>
    </div>
    <div id="result" style="display:none;"></div>
  </div>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    var TXN_ID = params.get('txn_id') || '';
    var currentLang = params.get('lang') || 'en';
    var successUrl = params.get('success_url') || '';

    var PADDLE_CONFIG_URL = 'https://pay.echoshorts.win/api/paddle-config';

    var i18n = {
      'en':    { loading: 'Loading checkout...', success: 'Payment successful!', close: 'You can close this page now.', closed: 'Checkout was closed.', retry: 'Try again', initFail: 'Failed to initialize' },
      'zh-CN': { loading: '正在加载结账页面...', success: '支付成功！', close: '您现在可以关闭此页面。', closed: '结账已关闭。', retry: '重试', initFail: '初始化失败' },
      'zh-TW': { loading: '正在載入結帳頁面...', success: '付款成功！', close: '您現在可以關閉此頁面。', closed: '結帳已關閉。', retry: '重試', initFail: '初始化失敗' },
      'vi':    { loading: 'Đang tải trang thanh toán...', success: 'Thanh toán thành công!', close: 'Bạn có thể đóng trang này.', closed: 'Thanh toán đã bị đóng.', retry: 'Thử lại', initFail: 'Khởi tạo thất bại' },
      'ja':    { loading: 'チェックアウトを読み込み中...', success: '支払い完了！', close: 'このページを閉じてください。', closed: 'チェックアウトが閉じられました。', retry: 'もう一度試す', initFail: '初期化に失敗しました' },
      'ko':    { loading: '결제 페이지 로딩 중...', success: '결제 완료!', close: '이 페이지를 닫으셔도 됩니다.', closed: '결제가 닫혔습니다.', retry: '다시 시도', initFail: '초기화 실패' },
      'th':    { loading: 'กำลังโหลดหน้าชำระเงิน...', success: 'ชำระเงินสำเร็จ!', close: 'คุณสามารถปิดหน้านี้ได้', closed: 'การชำระเงินถูกปิด', retry: 'ลองอีกครั้ง', initFail: 'เริ่มต้นล้มเหลว' },
      'id':    { loading: 'Memuat halaman pembayaran...', success: 'Pembayaran berhasil!', close: 'Anda dapat menutup halaman ini.', closed: 'Pembayaran ditutup.', retry: 'Coba lagi', initFail: 'Gagal menginisialisasi' },
      'ms':    { loading: 'Memuatkan halaman pembayaran...', success: 'Pembayaran berjaya!', close: 'Anda boleh menutup halaman ini.', closed: 'Pembayaran ditutup.', retry: 'Cuba lagi', initFail: 'Gagal memulakan' },
      'es':    { loading: 'Cargando página de pago...', success: '¡Pago exitoso!', close: 'Puede cerrar esta página.', closed: 'El pago fue cerrado.', retry: 'Intentar de nuevo', initFail: 'Error al inicializar' },
      'fr':    { loading: 'Chargement du paiement...', success: 'Paiement réussi !', close: 'Vous pouvez fermer cette page.', closed: 'Le paiement a été fermé.', retry: 'Réessayer', initFail: "Échec de l'initialisation" },
      'de':    { loading: 'Zahlungsseite wird geladen...', success: 'Zahlung erfolgreich!', close: 'Sie können diese Seite schließen.', closed: 'Zahlungsvorgang geschlossen.', retry: 'Erneut versuchen', initFail: 'Initialisierung fehlgeschlagen' },
      'pt':    { loading: 'Carregando página de pagamento...', success: 'Pagamento realizado!', close: 'Você pode fechar esta página.', closed: 'O pagamento foi fechado.', retry: 'Tentar novamente', initFail: 'Falha ao inicializar' },
      'ru':    { loading: 'Загрузка страницы оплаты...', success: 'Оплата прошла успешно!', close: 'Вы можете закрыть эту страницу.', closed: 'Оплата была закрыта.', retry: 'Попробовать снова', initFail: 'Ошибка инициализации' },
      'ar':    { loading: '...جارٍ تحميل صفحة الدفع', success: 'تم الدفع بنجاح!', close: '.يمكنك إغلاق هذه الصفحة الآن', closed: '.تم إغلاق صفحة الدفع', retry: 'حاول مرة أخرى', initFail: 'فشل في التهيئة' }
    };

    function t(key) {
      return (i18n[currentLang] || i18n['en'])[key] || i18n['en'][key];
    }

    function applyLang() {
      document.getElementById('lang-select').value = currentLang;
      document.getElementById('loading-text').textContent = t('loading');
      document.documentElement.lang = currentLang;
      if (currentLang === 'ar') {
        document.documentElement.dir = 'rtl';
      } else {
        document.documentElement.dir = 'ltr';
      }
    }

    function switchLang(lang) {
      currentLang = lang;
      var url = new URL(window.location);
      url.searchParams.set('lang', lang);
      window.history.replaceState(null, '', url);
      applyLang();
    }

    function showResult(html) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').innerHTML = html;
    }

    async function init() {
      applyLang();

      if (!TXN_ID) {
        showResult('<p class="error">Missing transaction ID</p>');
        return;
      }

      try {
        var res = await fetch(PADDLE_CONFIG_URL);
        var json = await res.json();
        var config = json.data;

        if (config.environment === 'sandbox') {
          Paddle.Environment.set('sandbox');
        }

        Paddle.Initialize({
          token: config.client_token,
          eventCallback: function(event) {
            if (event.name === 'checkout.completed') {
              if (successUrl) {
                window.location.href = successUrl;
              } else {
                showResult(
                  '<p class="success">' + t('success') + '</p>' +
                  '<div class="back-link"><p>' + t('close') + '</p></div>'
                );
              }
            }
            if (event.name === 'checkout.closed') {
              showResult(
                '<p class="error">' + t('closed') + '</p>' +
                '<div class="back-link"><a onclick="openCheckout()">' + t('retry') + '</a></div>'
              );
            }
          }
        });

        openCheckout();
      } catch (err) {
        showResult('<p class="error">' + t('initFail') + ': ' + err.message + '</p>');
      }
    }

    function openCheckout() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('result').style.display = 'none';
      document.getElementById('loading-text').textContent = t('loading');

      Paddle.Checkout.open({
        transactionId: TXN_ID
      });
    }

    init();
  </script>
</body>
</html>
