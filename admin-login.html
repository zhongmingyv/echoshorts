<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - EchoShorts</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card-bg: #1a1a1a;
    --text: #e0e0e0;
    --muted: #999999;
    --primary: #4ade80;
    --border: #2a2a2a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .lock-icon {
    margin-bottom: 20px;
  }
  .lock-icon svg {
    width: 48px;
    height: 48px;
    color: var(--primary);
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 32px;
  }
  .form-group {
    margin-bottom: 16px;
    text-align: left;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    border-color: var(--primary);
  }
  .btn-login {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    background: var(--primary);
    color: #0f0f0f;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-login:hover { opacity: 0.9; }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg {
    margin-top: 16px;
    color: #f87171;
    font-size: 13px;
    min-height: 20px;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="lock-icon">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
    </svg>
  </div>
  <h1>Admin Login</h1>
  <form id="loginForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login" id="loginBtn">Login</button>
  </form>
  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
const API = 'https://license.echoshorts.win';
function authHeaders() {
  return { 'Authorization': 'Bearer ' + localStorage.getItem('admin_token'), 'Content-Type': 'application/json' };
}
async function checkAuth() {
  const token = localStorage.getItem('admin_token');
  if (!token) { window.location.href = 'admin-login.html'; return false; }
  try {
    const res = await fetch(API + '/admin/verify', { headers: authHeaders() });
    if (!res.ok) throw new Error();
    return true;
  } catch { localStorage.removeItem('admin_token'); window.location.href = 'admin-login.html'; return false; }
}

// If already authenticated, redirect to dashboard
(async () => {
  const token = localStorage.getItem('admin_token');
  if (token) {
    try {
      const res = await fetch(API + '/admin/verify', { headers: authHeaders() });
      if (res.ok) { window.location.href = 'admin.html'; return; }
    } catch {}
    localStorage.removeItem('admin_token');
  }
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  errorMsg.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  try {
    const res = await fetch(API + '/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    localStorage.setItem('admin_token', data.token);
    window.location.href = 'admin.html';
  } catch (err) {
    errorMsg.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login';
  }
});
</script>
</body>
</html>
